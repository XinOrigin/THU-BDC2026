services:  
  app:
    image: bdc2026:latest
    pull_policy: never
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./temp:/app/temp
      - ./models:/app/model
      - .:/app  # 挂载整个项目目录，访问脚本
      

    working_dir: /app
    ports:
      - "6006:6006"
      
    # V3 守夜人训练入口
    entrypoint: []
    command: ["python", "-u", "run_v3_night.sh"]
    tty: true

    # 核心配置：指定NVIDIA运行时+暴露GPU
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    privileged: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 10.0